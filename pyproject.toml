[project]
name = "englo"
version = "0.1.0"
description = "Voice-first English tutor for Hindi-speaking beginners"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.34.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.scripts]
englo = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
